# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — LingoFriends production reverse proxy
#
# HTTP → HTTPS redirect + Let's Encrypt ACME challenge
# HTTPS → proxies to the SvelteKit app container on port 3000
#
# Replace YOUR_DOMAIN with the actual domain before deploying.
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # Hide nginx version from error pages / headers
    server_tokens off;

    # Compression for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Rate limiting — protects login/auth routes
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── HTTP: redirect to HTTPS + ACME challenge ──────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        # Let's Encrypt ACME challenge (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: main proxy ──────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        # SSL certs (managed by certbot / Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        # Modern TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Rate limit auth endpoints
        location ~ ^/(api/login|api/register|login|register) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy all requests to the SvelteKit Node server
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;

            # Required for WebSocket support (future SSE/live features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Static files (SvelteKit puts them in /_app/ — long cache)
        location /_app/ {
            proxy_pass http://app:3000;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
